<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gezi Rehberi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Türkiye Gezi Rehberi</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1b2433;--mut:#6b778a;--line:#e1e6ee;
  --navy:#1b365d;--accent:#c25b3d;--ok:#2f8f5b;--okbg:#e3f3ea;
  --part:#f1c2b3;--none:#dde3ec;--nodata:#eceff4;--stroke:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1520;--card:#182131;--ink:#e8edf5;--mut:#93a0b5;--line:#27334a;
  --navy:#0f1d33;--accent:#e08566;--ok:#4cbf82;--okbg:#17352a;
  --part:#7a3f2e;--none:#2b3850;--nodata:#1b2538;--stroke:#0f1520;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;line-height:1}
.hprog{font-size:13px;opacity:.9;margin-top:4px;display:flex;justify-content:space-between}
.hbar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:#7fe0a8;width:0;transition:width .3s}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;line-height:1}
nav button[aria-selected=true]{color:var(--accent);font-weight:700}
.view{display:none}.view.on{display:block}

/* harita */
.mapwrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#svg{display:block;width:100%;height:min(62vh,520px);touch-action:none;background:var(--card);user-select:none;-webkit-user-select:none}
#svg path{stroke:var(--stroke);stroke-width:.7;stroke-linejoin:round;fill:var(--nodata);cursor:pointer;vector-effect:non-scaling-stroke}
#svg path.p0{fill:var(--none)}
#svg path.pp{fill:var(--part);fill:color-mix(in srgb,var(--accent) calc(var(--r)*75% + 18%),var(--none))}
#svg path.pc{fill:var(--ok)}
#svg path.sel{stroke:var(--ink);stroke-width:2}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 4px;font-size:13px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.mapmsg{padding:40px 20px;text-align:center;color:var(--mut)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#c0392b}
.btn.block{display:block;width:100%;margin-top:10px;text-align:center}

/* liste */
.tools{position:sticky;top:var(--hh,84px);z-index:10;background:var(--bg);padding:4px 0 8px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.chips{display:flex;gap:8px;margin-top:8px}
.chips button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 6px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.city{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.ch{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:14px;text-align:left}
.cn{flex:1;font-weight:700;font-size:15px}
.cc{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.chev{width:10px;height:10px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.city.open .chev{transform:rotate(-135deg)}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--ok)}
.cbody{padding:4px 0 12px}
.cat{padding:10px 14px 4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.it{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;min-height:48px;border-top:1px solid var(--line)}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);background:none;color:transparent;font-size:18px;line-height:1;font-weight:700;display:grid;place-items:center;padding:0}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tx{flex:1;min-width:0}
.nm{word-break:break-word}
.it.done .nm{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--mut)}
.nt{font-size:13px;color:var(--mut);margin-top:1px;word-break:break-word}
.more{flex:none;width:40px;height:40px;border:0;background:none;color:var(--mut);font-size:22px;border-radius:10px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 14px 0;border-top:1px dashed var(--line);margin-top:6px}
.addrow input,.addrow select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0;width:100%}
.addrow .full{grid-column:1/-1}
.addrow .btn{padding:10px 14px}
.cfoot{padding:8px 14px 0;text-align:right}
.cfoot button{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.addcity{margin-top:14px}

/* özet */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:13px;color:var(--mut)}
.sumrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;width:100%;text-align:left}
.sumrow .bar{grid-column:1/-1;border-radius:3px;margin-top:6px}
.sumrow em{font-style:normal;color:var(--mut);font-size:13px}
.sumsel{margin:14px 0 4px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}

/* sheet */
#back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:none;max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#sheet h2{margin:0 0 4px;font-size:18px}
#sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
#sheet input,#sheet textarea,#sheet select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
#sheet textarea{min-height:70px;resize:vertical}
.sub{color:var(--mut);font-size:14px}
.row2{display:flex;gap:10px;margin-top:14px}.row2 .btn{flex:1}
.menuitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;font-size:16px}
.menuitem:first-of-type{border-top:0}
.menuitem small{display:block;color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:88vw;display:none;text-align:center}
</style>
</head>
<body>
<header id="hd">
  <div class="hrow"><h1>Türkiye Gezi Rehberi</h1><button class="iconbtn" id="menuBtn" aria-label="Menü">⋮</button></div>
  <div class="hprog"><span id="hp1"></span><span id="hp2"></span></div>
  <div class="hbar"><i id="hbar"></i></div>
</header>
<main>
  <section class="view" id="v-harita">
    <div class="mapwrap">
      <div id="mapHost"><div class="mapmsg">Harita yükleniyor…</div></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Tamamı gezildi</span>
      <span><i style="background:var(--part)"></i>Kısmen</span>
      <span><i style="background:var(--none)"></i>Henüz yok</span>
      <span><i style="background:var(--nodata)"></i>Listede değil</span>
    </div>
    <div class="sub">İle dokun: ilerlemeyi gör, listeye git. İki parmakla yaklaştır.</div>
  </section>

  <section class="view" id="v-liste">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Şehir veya yer ara…" autocomplete="off">
      <div class="chips" id="chips">
        <button data-f="all" aria-pressed="true">Hepsi</button>
        <button data-f="todo" aria-pressed="false">Kalan</button>
        <button data-f="done" aria-pressed="false">Gezilen</button>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-ozet"></section>
</main>
<nav id="tabs">
  <button data-t="harita" aria-selected="true"><b>🗺</b>Harita</button>
  <button data-t="liste" aria-selected="false"><b>☰</b>Liste</button>
  <button data-t="ozet" aria-selected="false"><b>📊</b>Özet</button>
</nav>
<div id="back"></div><div id="sheet" role="dialog" aria-modal="true"></div><div id="toast"></div>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- veri ---------- */
let S;
function fresh(){return{cities:DEFAULT.map(c=>({id:uid(),name:c.name,cats:c.cats.map(k=>({name:k.name,items:k.items.map(i=>({id:uid(),n:i.n,d:!!i.d,note:i.note||''}))}))}))}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.cities)){S=o;return}}}catch(e){}
  S=fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kaydedilemedi: tarayıcı depolaması dolu veya kapalı')}}
const cityById=id=>S.cities.find(c=>c.id===id);
function stats(c){let t=0,d=0;for(const k of c.cats)for(const i of k.items){t++;if(i.d)d++}return{t,d}}
function totals(){let t=0,d=0;for(const c of S.cities){const s=stats(c);t+=s.t;d+=s.d}return{t,d}}

/* ---------- yardımcılar ---------- */
const TRMAP={'ı':'i','İ':'i','I':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c','â':'a','Â':'a','î':'i','Î':'i','û':'u','Û':'u'};
const norm=s=>String(s||'').replace(/[ıİIşŞğĞüÜöÖçÇâÂîÎûÛ]/g,m=>TRMAP[m]).toLowerCase().replace(/[^a-z]/g,'');
const ALIAS={afyon:'afyonkarahisar',icel:'mersin',urfa:'sanliurfa',antep:'gaziantep',maras:'kahramanmaras',kmaras:'kahramanmaras',hakkari:'hakkari'};
const provKey=n=>{const k=norm(n);return ALIAS[k]||k};
function cityKeys(name){
  const base=name.replace(/^\s*\d+\.\s*/,'').replace(/\(.*?\)/g,'');
  return base.split('&').map(p=>provKey(p.replace(/çevresi/i,'').replace(/ÇEVRESİ/,''))).filter(Boolean);
}
function provToCity(){
  const m={};
  const single=S.cities.filter(c=>!c.name.includes('&')),multi=S.cities.filter(c=>c.name.includes('&'));
  for(const c of single)for(const k of cityKeys(c.name))m[k]=c;
  for(const c of multi)for(const k of cityKeys(c.name))if(!m[k])m[k]=c;
  return m;
}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}
function sheet(html){const s=$('#sheet');s.innerHTML=html;s.style.display='block';$('#back').style.display='block';s.scrollTop=0;return s}
function closeSheet(){$('#sheet').style.display='none';$('#back').style.display='none'}
$('#back').addEventListener('click',closeSheet);

  $('#hp1').textContent=`${d} / ${t} yer gezildi`;$('#hp2').textContent=`%${p}`;$('#hbar').style.width=p+'%';
}

let tab='harita';

  tab=t;

addEventListener('resize',syncHH);

/* ---------- LİSTE ---------- */
const openSet=new Set();let filter='all',query='';
const itemVisible=i=>filter==='all'||(filter==='done'?i.d:!i.d);
function cityEl(c,filtering){
  const st=stats(c);
  const q=norm(query);
  const cityMatch=q&&norm(c.name).includes(q);
  const open=filtering?true:openSet.has(c.id);
  const el=document.createElement('section');el.className='city'+(open?' open':'');el.dataset.id=c.id;
  const pct=st.t?st.d/st.t*100:0;
  let body='';
  if(open){
    body='<div class="cbody">';
    let any=false;
    for(const [ki,k] of c.cats.entries()){
      const items=k.items.filter(i=>itemVisible(i)&&(!q||cityMatch||norm(i.n).includes(q)||norm(k.name).includes(q)));
      if(filtering&&!items.length)continue;
      any=true;
      body+=`<div class="cat">${esc(k.name)}</div>`;
      for(const i of items){
        body+=`<div class="it${i.d?' done':''}" data-i="${i.id}"><button class="chk" aria-label="Gittim" aria-pressed="${i.d}">✓</button><div class="tx"><div class="nm">${esc(i.n)}</div>${i.note?`<div class="nt">${esc(i.note)}</div>`:''}</div><button class="more" aria-label="Düzenle">⋯</button></div>`;
      }
    }
    if(!filtering){
      const last=c.cats.length-1;
      body+=`<form class="addrow" data-add>
        <input name="n" placeholder="＋ Yeni yer ekle…" enterkeyhint="done" autocomplete="off" required>
        <button class="btn" type="submit">Ekle</button>
        <select name="k" class="full">${c.cats.map((k,ki)=>`<option value="${ki}"${ki===last?' selected':''}>${esc(k.name)}</option>`).join('')}<option value="new">＋ Yeni başlık…</option></select>
        <input name="nk" class="full" placeholder="Yeni başlık adı" style="display:none" autocomplete="off">
      </form>
      <div class="cfoot"><button data-act="editcity">Şehri düzenle / sil</button></div>`;
    }else if(!any){body+='<div class="empty">Eşleşen yer yok</div>'}
    body+='</div>';
  }
  el.innerHTML=`<button class="ch" aria-expanded="${open}"><span class="cn">${esc(c.name)}</span><span class="cc">${st.d} / ${st.t}</span><span class="chev"></span></button><div class="bar"><i style="width:${pct}%"></i></div>${body}`;
  return el;
}
function renderList(){
  const host=$('#list');host.textContent='';
  const filtering=!!query.trim()||filter!=='all';
  const q=norm(query);
  let n=0;
  for(const c of S.cities){
    if(filtering){
      const cityMatch=q&&norm(c.name).includes(q);
      const has=c.cats.some(k=>k.items.some(i=>itemVisible(i)&&(!q||cityMatch||norm(i.n).includes(q)||norm(k.name).includes(q))));
      if(!has)continue;
    }
    host.appendChild(cityEl(c,filtering));n++;
  }
  if(!n)host.innerHTML='<div class="empty">Sonuç bulunamadı</div>';
  if(!filtering){
    const f=document.createElement('form');f.className='addcity addrow';f.dataset.addcity='1';f.style.border='0';
    f.innerHTML='<input name="n" placeholder="＋ Yeni şehir ekle (örn. Rize)…" autocomplete="off" required><button class="btn" type="submit">Ekle</button>';
    host.appendChild(f);
  }
}
function refreshCity(id){
  const old=$(`.city[data-id="${id}"]`);const c=cityById(id);
  if(old&&c&&!(query.trim()||filter!=='all'))old.replaceWith(cityEl(c,false));else renderList();
  updateHeader();
}

    const id=cityNode.dataset.id;openSet.has(id)?openSet.delete(id):openSet.add(id);

    for(const k of c.cats){const it=k.items.find(i=>i.id===row.dataset.i);if(it){

      it.d=!it.d;save();refreshCity(c.id);return}}

});
$('#list').addEventListener('change',e=>{

$('#list').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.addcity){
    const name=f.n.value.trim();if(!name)return;
    const c={id:uid(),name:`${S.cities.length+1}. ${name.toLocaleUpperCase('tr-TR')}`,cats:[{name:'Öne Çıkan Gezi Noktaları',items:[]}]};
    S.cities.push(c);openSet.add(c.id);save();renderList();updateHeader();toast('Şehir eklendi');
    $(`.city[data-id="${c.id}"] input[name=n]`)?.focus();return;
  }
  const cityNode=f.closest('.city'),c=cityById(cityNode.dataset.id);
  const name=f.n.value.trim();if(!name)return;
  let k;
  if(f.k.value==='new'){const kn=f.nk.value.trim();if(!kn){f.nk.focus();toast('Yeni başlık adını yaz');return}k={name:kn,items:[]};c.cats.push(k)}
  else k=c.cats[+f.k.value]||c.cats[c.cats.length-1];
  k.items.push({id:uid(),n:name,d:false,note:''});
  save();refreshCity(c.id);
  const nf=$(`.city[data-id="${c.id}"] form[data-add]`);
  if(nf){nf.k.value=String(c.cats.indexOf(k));nf.n.focus()}
});
function editItem(c,k,it){
  const s=sheet(`<h2>Yeri düzenle</h2><div class="sub">${esc(c.name)}</div>
    <label>Yer adı</label><input id="e_n" value="${esc(it.n)}">
    <label>Not</label><textarea id="e_note" placeholder="Not ekle…">${esc(it.note)}</textarea>
    <label>Başlık</label><select id="e_k">${c.cats.map((x,i)=>`<option value="${i}"${x===k?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="row2"><button class="btn danger" id="e_del">Sil</button><button class="btn" id="e_ok">Kaydet</button></div>`);
  $('#e_ok',s).onclick=()=>{

    it.n=n;it.note=$('#e_note',s).value.trim();

    if(nk!==k){k.items.splice(k.items.indexOf(it),1);nk.items.push(it)}

  };
  $('#e_del',s).onclick=()=>{if(confirm(`"${it.n}" silinsin mi?`)){k.items.splice(k.items.indexOf(it),1);save();closeSheet();refreshCity(c.id)}};
}
function editCity(id){
  const c=cityById(id);
  const s=sheet(`<h2>Şehri düzenle</h2>

    <div class="row2"><button class="btn danger" id="c_del">Şehri sil</button><button class="btn" id="c_ok">Kaydet</button></div>`);
  $('#c_ok',s).onclick=()=>{const n=$('#c_n',s).value.trim();if(!n)return;c.name=n;save();closeSheet();renderList()};
  $('#c_del',s).onclick=()=>{if(confirm(`"${c.name}" ve içindeki tüm yerler silinsin mi?`)){S.cities=S.cities.filter(x=>x!==c);save();closeSheet();renderList();updateHeader()}};

function openCityInList(id){
  openSet.add(id);query='';$('#q').value='';filter='all';

/* ---------- ÖZET ---------- */
let sortMode='sira';
function renderSummary(){
  const {t,d}=totals();const done=S.cities.filter(c=>{const s=stats(c);return s.t&&s.d===s.t}).length;
  let rows=S.cities.map(c=>({c,...stats(c)}));
  if(sortMode==='kalan')rows.sort((a,b)=>(b.t-b.d)-(a.t-a.d));
  if(sortMode==='gezilen')rows.sort((a,b)=>b.d-a.d);

let geoPaths=null,geoLoading=false,pz=null,selKey=null,vb0=null;
function geoToPaths(gj){
  if(!gj||gj.type==='Topology')throw new Error('TopoJSON desteklenmiyor');
  const feats=gj.type==='FeatureCollection'?gj.features:gj.type==='Feature'?[gj]:[];
  const polys=g=>!g?[]:g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const f of feats)for(const p of polys(f.geometry))for(const r of p)for(const pt of r){
    if(pt[0]<minx)minx=pt[0];if(pt[0]>maxx)maxx=pt[0];if(pt[1]<miny)miny=pt[1];if(pt[1]>maxy)maxy=pt[1]}
  if(!(maxx>minx))throw new Error('Geçersiz harita verisi');
  const kx=Math.cos((miny+maxy)/2*Math.PI/180),K=100;
  const out=[];
  for(const f of feats){
    const pr=f.properties||{};
    const keys=['name','NAME','Name','il','IL','Il','ad','AD','adi','ADI','il_adi','IL_ADI','ILADI','NAME_1','shapeName','province','text'];
    let nm=null;for(const k of keys)if(typeof pr[k]==='string'&&pr[k]){nm=pr[k];break}
    if(!nm)for(const k in pr)if(typeof pr[k]==='string'){nm=pr[k];break}
    if(!nm)continue;
    let d='';
    for(const p of polys(f.geometry))for(const r of p){
      let last='';let s='';let n=0;
      for(const pt of r){
        const x=((pt[0]-minx)*kx*K).toFixed(1),y=((maxy-pt[1])*K).toFixed(1),cur=x+','+y;
        if(cur===last)continue;last=cur;s+=(n++?'L':'M')+cur;
      }
      if(n>2)d+=s+'Z';
    }
    if(d)out.push({k:provKey(nm),name:nm,d});
  }
  if(out.length<70)throw new Error('Beklenen 81 il bulunamadı ('+out.length+')');
  return {paths:out,w:(maxx-minx)*kx*K,h:(maxy-miny)*K};
}
async function loadGeo(){
  if(geoPaths||geoLoading)return;
  try{const c=localStorage.getItem(GEOKEY);if(c){geoPaths=JSON.parse(c);return}}catch(e){}
  geoLoading=true;let err='';
  for(const u of GEO_SOURCES){
    try{
      const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
      geoPaths=geoToPaths(await r.json());
      try{localStorage.setItem(GEOKEY,JSON.stringify(geoPaths))}catch(e){}
      break;
    }catch(e){err=String(e.message||e)}
  }
  geoLoading=false;
  if(!geoPaths)throw new Error(err||'Harita yüklenemedi');
}

  <div class="zoom"><button data-z="1.5" aria-label="Yakınlaştır">＋</button><button data-z="0.667" aria-label="Uzaklaştır">−</button><button data-z="0" aria-label="Sıfırla">⌂</button></div>`;

  $('#pOpen',s).onclick=()=>{closeSheet();openCityInList(c.id)};$('#pClose',s).onclick=closeSheet;

function panZoom(svg,start,onTap){
  let vb={...start};const apply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const pts=new Map();let st=null,moved=false,tapKey=null,startDist=0;
  const upp=v=>{const r=svg.getBoundingClientRect();return Math.max(v.w/r.width,v.h/r.height)};
  const toSvg=(cx,cy,v)=>{const r=svg.getBoundingClientRect(),u=upp(v),ox=(r.width-v.w/u)/2,oy=(r.height-v.h/u)/2;return{x:v.x+(cx-r.left-ox)*u,y:v.y+(cy-r.top-oy)*u}};
  const clampW=w=>Math.min(start.w*1.1,Math.max(start.w/14,w));
  function zoomAt(f,cx,cy,base){ // f: yeni_genişlik/eski_genişlik
    const v=base||vb;let nw=clampW(v.w*f);f=nw/v.w;const nh=v.h*f;
    const a=toSvg(cx,cy,v),r=svg.getBoundingClientRect(),u=upp(v)*f,ox=(r.width-nw/u)/2,oy=(r.height-nh/u)/2;
    vb={x:a.x-(cx-r.left-ox)*u,y:a.y-(cy-r.top-oy)*u,w:nw,h:nh};apply();
  }
  svg.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;tapKey=e.target.dataset?.k||null;st={x:e.clientX,y:e.clientY,vb:{...vb}}}
    else{moved=true;const [a,b]=[...pts.values()];startDist=Math.hypot(a.x-b.x,a.y-b.y);st={vb:{...vb},mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
  });
  svg.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      const dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(!moved&&Math.hypot(dx,dy)<7)return;moved=true;
      const u=upp(st.vb);vb={...st.vb,x:st.vb.x-dx*u,y:st.vb.y-dy*u};apply();
    }else if(pts.size>=2){
      const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(!startDist)return;
      zoomAt(startDist/d,(a.x+b.x)/2,(a.y+b.y)/2,st.vb);
    }
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size===0){if(!moved&&e.type==='pointerup'&&tapKey)onTap(tapKey);st=null}
    else if(pts.size===1){const [p]=[...pts.values()];st={x:p.x,y:p.y,vb:{...vb}};moved=true}
  };
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')end(e)});
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
  return{zoom(f){
    const r=svg.getBoundingClientRect();
    if(f===0){vb={...start};apply();return}
    zoomAt(1/f,r.left+r.width/2,r.top+r.height/2);
  }};
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files){
  const enc=new TextEncoder(),chunks=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const nb=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
    chunks.push(lh,nb,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+data.length;
  }
  let cs=0;for(const c of central)cs+=c.length;
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob([...chunks,...central,end],{type:'application/zip'});
}

<cellXfs count="9">

<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>

  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

function menu(){
  const s=sheet(`<h2>Menü</h2>
  <button class="menuitem" id="m_send"><span style="font-size:22px">✉️</span><span>Excel olarak gönder / mail at<small>Paylaş menüsü açılır; Mail, WhatsApp, Drive…</small></span></button>
  <button class="menuitem" id="m_dl"><span style="font-size:22px">⬇️</span><span>Excel dosyasını indir<small>.xlsx (Gezi Listesi + Özet sayfaları)</small></span></button>
  <button class="menuitem" id="m_bk"><span style="font-size:22px">💾</span><span>Yedek al (JSON)<small>Telefon değiştirirsen veya veriyi temizlersen işine yarar</small></span></button>
  <button class="menuitem" id="m_rs"><span style="font-size:22px">📂</span><span>Yedekten geri yükle</span></button>
  <button class="menuitem" id="m_reset"><span style="font-size:22px">♻️</span><span>Başlangıç listesine dön<small>Yaptığın tüm değişiklikler silinir</small></span></button>
  <input type="file" id="m_file" accept="application/json,.json" style="display:none">`);
  $('#m_send',s).onclick=sendExcel;
  $('#m_dl',s).onclick=()=>{closeSheet();download(buildXlsx(),`Turkiye_Gezi_Rehberi_${stamp()}.xlsx`);toast('Excel indirildi')};
  $('#m_bk',s).onclick=()=>{closeSheet();download(new Blob([JSON.stringify(S)],{type:'application/json'}),`gezi-yedek-${stamp()}.json`)};
  $('#m_rs',s).onclick=()=>$('#m_file',s).click();
  $('#m_file',s).onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.cities))throw 0;S=o;save();closeSheet();setTab(tab);updateHeader();toast('Yedek yüklendi')}catch(x){toast('Geçersiz yedek dosyası')}
  };
  $('#m_reset',s).onclick=()=>{if(confirm('Tüm değişiklikler silinip ilk liste yüklensin mi?')){S=fresh();save();closeSheet();setTab(tab);updateHeader()}};
}
$('#menuBtn').addEventListener('click',menu);

/* ---------- başlat ---------- */
load();updateHeader();syncHH();setTab('harita');
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
